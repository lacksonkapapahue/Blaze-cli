name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(go fmt ./...)" || (git diff && exit 1)
      - name: Vet
        run: |
          for t in linux/amd64 windows/amd64 darwin/arm64; do GOOS=${t%/*} GOARCH=${t#*/} go vet ./...; done
      - name: Test
        run: go test -race ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks inherit,-ST1005 ./...
      - name: Build all platforms
        run: |
          V=$(cat VERSION)
          mkdir -p dist
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=v$V" -o dist/blaze-$os-$arch$ext .
          done
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum blaze-* > SHA256SUMS)
          ls -l dist
      - name: Smoke test
        run: ./dist/blaze-linux-amd64 version && ./dist/blaze-linux-amd64 pc
      - uses: actions/upload-artifact@v4
        with:
          name: blaze-cli
          path: dist/
          retention-days: 14
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=v$(cat VERSION)
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::notice::$V is already released; bump VERSION to publish a new one."
            exit 0
          fi
          gh release create "$V" dist/* --title "Blaze CLI $V" --notes "Blaze CLI $V. What's new: see CHANGELOG.md. Install: see README." --latest
